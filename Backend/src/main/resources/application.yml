spring:
  application:
    name: ingestion-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intellireport}
    username: ${SPRING_DATASOURCE_USERNAME:intellireport}
    password: ${SPRING_DATASOURCE_PASSWORD:intellireport}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${APP_FILE_MAX_SIZE:200MB}
      max-request-size: ${APP_FILE_MAX_SIZE:200MB}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always

# ---- Phase 1 app config ----
app:
  jwt:
    # HS256 secret — override via env in real deploys. Min 32 chars.
    secret: ${APP_JWT_SECRET:change-me-to-a-256-bit-secret-for-local-dev-only-0123456789}
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:60}
    refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL:7}
  files:
    max-size-bytes: 209715200 # 200MB default per PRD 4.1
    allowed-mime-types: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,image/jpeg,image/png,application/zip
  extraction:
    confidence-threshold: 0.75
  llm:
    provider: ${APP_LLM_PROVIDER:none}          # none | ollama | openai-compatible
    endpoint: ${APP_LLM_ENDPOINT:http://localhost:11434}
    model: ${APP_LLM_MODEL:llama3.1:8b}         # e.g. kimi-k2-0711-preview for Moonshot
    api-key: ${APP_LLM_API_KEY:}
    min-confidence: 0.7
    timeout-seconds: 60
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:intellireport-docs}
    secure: ${MINIO_SECURE:false}

logging:
  level:
    com.minex.backend: INFO
